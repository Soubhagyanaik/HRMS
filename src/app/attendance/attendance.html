<div class="container">
  <h2>Attendance</h2>

  <!-- Error message -->
  <div class="error" *ngIf="error">{{ error }}</div>

  <!-- Form -->
  <div class="form">
    <select [(ngModel)]="newAttendance.employee">
      <option value="0">Select Employee</option>
      <option *ngFor="let emp of employees" [value]="emp.id">{{ emp.full_name }}</option>
    </select>

    <select [(ngModel)]="newAttendance.status">
      <option value="Present">Present</option>
      <option value="Absent">Absent</option>
    </select>

    <button (click)="addAttendance()">Mark Attendance</button>
  </div>

  <!-- Attendance Table -->
  <table *ngIf="attendanceRecords.length > 0">
    <tr>
      <th>Employee</th>
      <th>Date</th>
      <th>Status</th>
    </tr>
    <tr *ngFor="let att of attendanceRecords">
      <td>{{ att.employee_full_name }}</td>
      <td>{{ att.date }}</td>
      <td>{{ att.status }}</td>
    </tr>
  </table>

  <div *ngIf="attendanceRecords.length === 0">No records found</div>
</div>
