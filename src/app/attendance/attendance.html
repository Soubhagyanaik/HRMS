<div class="container">
  <h2>Attendance</h2>

  <div *ngIf="error" class="error">{{error}}</div>
  <div *ngIf="loading">Loading...</div>

   <!-- Add Attendance Form -->
  <div class="form">
    <select [(ngModel)]="newAttendance.employee">
      <option value="" disabled>Select Employee</option>
      <option *ngFor="let emp of employees" [value]="emp.id">{{emp.full_name}}</option>
    </select>

    <select [(ngModel)]="newAttendance.status">
      <option value="Present">Present</option>
      <option value="Absent">Absent</option>
    </select>

    <button (click)="addAttendance()">Mark Attendance</button>
  </div> 

  <!-- Attendance Table -->
  <table *ngIf="attendanceRecords.length > 0">
    <tr>
      <th>Employee</th>
      <th>Date</th>
      <th>Status</th>
    </tr>
    <tr *ngFor="let record of attendanceRecords">
      <td>{{record.employee}}</td>
      <td>{{record.date | date}}</td>
      <td>{{record.status}}</td>
    </tr>
  </table>

  <div *ngIf="attendanceRecords.length == 0 && !loading">No records found</div> 
</div>
